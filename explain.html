<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Bruno's AI Label Explanation</title>
    <link rel="shortcut icon" href="static/favicon.svg" type="image/svg">
    <link rel='stylesheet' href='static/style.css'>
</head>
<body class='page_main_body'>
    <main>
        <header>
            <h1 id='dynamic_heading_element'>Bruno's AI Label Explanation</h1>
            <p id='dynamic_subtitle_element'></p>
        </header>
        
        <section id='iframe_presentation_container'>
            <iframe id='label_iframe_element' title='AI Label Presentation' aria-hidden='true'></iframe>
        </section>
        
        <section>
            <ul id='legend_list_element'></ul>
        </section>

        <section>
            <h2>Label Generator</h2>
            <p>Select the categories of AI-generated content your label should mark</p>
            
            <div class='form_group_element' id='checkbox_container_element'>
                <label>
                    <input type='checkbox' value='code' class='symbol_checkbox_element'>
                    Code
                </label>
                <label>
                    <input type='checkbox' value='music' class='symbol_checkbox_element'>
                    Music and Sound
                </label>
                <label>
                    <input type='checkbox' value='picture' class='symbol_checkbox_element'>
                    Picture
                </label>
                <label>
                    <input type='checkbox' value='text' class='symbol_checkbox_element'>
                    Text
                </label>
                <label>
                    <input type='checkbox' value='voice' class='symbol_checkbox_element'>
                    Voice
                </label>
                <label>
                    <input type='checkbox' value='other' class='symbol_checkbox_element'>
                    Other (unclarified)
                </label>
            </div>

            <hr class='divider_element'>

            <div class='form_group_element'>
                <label>
                    <input type='checkbox' id='single_mode_checkbox_element'>
                    Single Symbol (No brackets, only one sybol)
                </label>
            </div>

            <h2>Preview</h2>
            <div id='iframe_preview_container_element'></div>

            <h2>Embed Code</h2>
            <textarea id='output_textarea_element' readonly aria-label='Generated HTML iframe code'></textarea>

            <h2>Markdown Link (i.e. for <code>README.md</code>)</h2>
            <textarea id='markdown_output_textarea_element' readonly aria-label='Generated Markdown link'></textarea>
        </section>

        <footer>
            <a href='index.html'>Learn more about the AI Label System</a>
        </footer>
    </main>
    <script src='static/script.js'></script>
</body>
</html>
